<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정발클럽 그라운드골프</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#1769e0;--green:#159447;--red:#ef4048;--orange:#f59a00;--purple:#5b59d6;--teal:#079b88;--ink:#172033;--muted:#6d7480;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#e9eef5;color:var(--ink)}
.app{max-width:520px;min-height:100vh;margin:auto;background:white;box-shadow:0 0 30px #0002;padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #eee;padding:13px 16px;display:flex;align-items:center;gap:10px}
.logo{font-size:30px}.brand{font-size:22px;font-weight:900;color:#12366d}.sub{font-size:13px;color:#777}.spacer{flex:1}.back,.menu{border:0;background:none;font-size:26px;cursor:pointer}
.hero{height:205px;background:linear-gradient(#0001,#0007),url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=1000&q=80') center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:white}
.hero h1{font-size:29px;margin:0 0 8px}.hero p{margin:0;background:#118b43;align-self:flex-start;padding:7px 13px;border-radius:20px;font-weight:700}
.notice{margin:14px;padding:14px;border-radius:18px;background:#fff5e9;display:flex;gap:12px;align-items:center}.notice b{color:#e3262e}.notice .ico{font-size:32px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}.tile{border:0;border-radius:18px;color:white;min-height:118px;padding:15px 8px;font-weight:800;font-size:18px;cursor:pointer}.tile small{display:block;font-size:12px;margin-top:6px;font-weight:600}.red{background:var(--red)}.blue{background:var(--blue)}.green{background:var(--green)}.orange{background:var(--orange)}.purple{background:var(--purple)}.teal{background:var(--teal)}
.page{padding:16px}.title{font-size:28px;font-weight:900;margin:4px 0 14px}.card{border:1px solid #e5e8ee;border-radius:16px;padding:15px;margin:10px 0;background:white;box-shadow:0 4px 15px #0000000b}.tag{display:inline-block;color:white;background:var(--green);border-radius:8px;padding:4px 8px;font-size:12px}.card h3{margin:8px 0}.date{font-size:13px;color:#777}.btn{width:100%;border:0;border-radius:14px;background:var(--blue);color:white;padding:15px;font-size:18px;font-weight:800;margin-top:12px;cursor:pointer}.btn.green{background:var(--green)}
label{display:block;font-weight:750;margin:14px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cfd5df;border-radius:10px;font-size:16px}textarea{min-height:85px}
.success{text-align:center;padding:45px 20px}.check{font-size:70px;color:var(--green)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calendar div{padding:9px 2px}.today{background:var(--red);color:white;border-radius:50%}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ph{height:125px;border-radius:14px;background:linear-gradient(135deg,#cfe8ff,#9ad0a5);display:grid;place-items:center;font-size:40px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-grid button{padding:18px;border:1px solid #ddd;background:white;border-radius:14px;font-weight:800;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid #eee;text-align:left}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:white;border-top:1px solid #ddd;display:flex;z-index:6}
nav button{flex:1;border:0;background:white;font-size:12px;color:#555;cursor:pointer}nav span{display:block;font-size:22px}
.hidden{display:none}.sectionhead{padding:18px 16px;color:white;font-size:25px;font-weight:900;background:var(--blue)}
@media(min-width:700px){body{padding:20px 0}.app{min-height:calc(100vh - 40px);border-radius:25px;overflow:hidden}}
</style>
</head>
<body><main class="app">
<header><button class="back hidden" id="back" onclick="go('home')">‹</button><div class="logo">🏌️</div><div><div class="brand">정발클럽</div><div class="sub">그라운드골프</div></div><div class="spacer"></div><button class="menu" onclick="go('admin')">☰</button></header>
<div id="view"></div>
<nav><button onclick="go('home')"><span>🏠</span>홈</button><button onclick="go('schedule')"><span>🗓️</span>일정</button><button onclick="alert('새 알림이 없습니다.')"><span>🔔</span>알림</button><button onclick="go('member')"><span>👤</span>내 정보</button></nav>
</main>
<script>
const SUPABASE_URL = 'https://dbnpbdlohzponmffbqgt.supabase.co';
 const SUPABASE_KEY = 'sb_publishable_O-OI_ZMjZpfa2ewd9IhTQQ_EqP9-Kea';
let notices = [ {tag:'행사안내',title:'9월 30일(수) 컨테이너 개소식 안내',date:'2026. 09. 23',body:'정발클럽 컨테이너 개소식을 개최합니다. 뜻깊은 행사에 참석해 주셔서 자리를 빛내주시기 바랍니다.'},
 {tag:'대회안내',title:'11월 7일 가족사랑 대회 참가 안내',date:'2026. 09. 20',body:'가족사랑 대회 참가 신청 안내입니다.'},
 {tag:'일반공지',title:'10월 힐링여행 안내',date:'2026. 09. 18',body:'회원 여러분의 많은 참여 바랍니다.'}
];
let applications=JSON.parse(localStorage.getItem('jb_apps')||'[]');
 async function saveToSupabase(data){
  const row = {
    name: data.name,
    phone: data.phone,
    attendance: data.attend,
   guests: parseInt(data.guests) || 0,
    memo: data.memo,
    kind: data.kind
  };

  const response = await fetch(`${SUPABASE_URL}/rest/v1/event_applications`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(row)
  });

  if(!response.ok){
    throw new Error(await response.text());
  }
}
function layout(x){document.getElementById('view').innerHTML=x;document.getElementById('back').classList.toggle('hidden',location.hash==='#home'||!location.hash)}
function go(p){location.hash=p;render()}
function home(){return `<section class="hero"><h1>함께하는 골프,<br>더 즐거운 인생!</h1><p>건강한 오늘, 행복한 정발클럽</p></section>
<div class="notice" onclick="go('notice-0')"><div class="ico">📣</div><div><b>오늘의 공지</b><br><strong>9월 30일(수) 컨테이너 개소식 안내</strong></div></div>
<div class="grid">
<button class="tile red" onclick="go('notices')">📣<br>공지사항<small>클럽 소식 확인하기</small></button>
<button class="tile blue" onclick="go('schedule')">📅<br>클럽 일정<small>행사 일정 보기</small></button>
<button class="tile green" onclick="go('event')">📝<br>행사 신청<small>참석 신청하기</small></button>
<button class="tile orange" onclick="go('contest')">🏆<br>대회 신청<small>대회 참가 신청</small></button>
<button class="tile purple" onclick="go('member')">👥<br>회원 공간<small>내 정보 보기</small></button>
<button class="tile teal" onclick="go('gallery')">🖼️<br>사진첩<small>활동 사진 보기</small></button></div>`}
function noticesPage(){return `<div class="sectionhead">📣 공지사항</div><div class="page">${notices.map((n,i)=>`<div class="card" onclick="go('notice-${i}')"><span class="tag">${n.tag}</span><div class="date">${n.date}</div><h3>${n.title}</h3>› 자세히 보기</div>`).join('')}</div>`}
function notice(i){let n=notices[i];return `<div class="page"><span class="tag">${n.tag}</span><div class="date">${n.date}</div><h1>${n.title}</h1><div class="ph">🏌️‍♂️</div><p style="line-height:1.8">${n.body}</p><div class="card"><b>일시</b>　9월 30일(수)<br><b>시간</b>　오전 9시<br><b>장소</b>　정발클럽 그라운드골프장</div><button class="btn" onclick="go('event')">참석 신청하기</button></div>`}
function eventForm(kind='행사'){return `<div class="sectionhead" style="background:${kind==='대회'?'#f59a00':'#159447'}">${kind==='대회'?'🏆 대회 신청':'📅 행사 신청'}</div><form class="page" onsubmit="submitApp(event,'${kind}')">
<div class="card"><h2>${kind==='대회'?'11월 7일 가족사랑 대회':'9월 30일 컨테이너 개소식'}</h2><p>📍 정발클럽 그라운드골프장</p></div>
<label>이름 *</label><input name="name" required placeholder="이름을 입력하세요">
<label>연락처 *</label><input name="phone" required inputmode="tel" placeholder="010-0000-0000">
<label>참석 여부 *</label><select name="attend"><option>참석합니다</option><option>참석하지 않습니다</option></select>
<label>동반 인원</label><select name="guests"><option>0</option><option>1</option><option>2</option><option>3</option></select>
<label>추가사항</label><textarea name="memo" placeholder="전달할 내용이 있으면 적어주세요."></textarea>
<button class="btn green">신청하기</button></form>`}
async function submitApp(e,kind){
  e.preventDefault();
  const f=e.target;
  const data={
    name:f.name.value,
    phone:f.phone.value,
    attend:f.attend.value,
    guests: parseInt(f.guests.value) || 0,
    memo:f.memo.value,
    kind:kind
  };

  try{
    await saveToSupabase(data);
    applications.push(data);
    localStorage.setItem('jb_apps',JSON.stringify(applications));
    go('success');
  }catch(err){
    alert('신청 저장 중 오류가 발생했습니다.');
    console.error(err);
  }
}
 
function success(){return `<div class="success"><div class="check">✓</div><h1>신청이 완료되었습니다!</h1><p>정상적으로 접수되었습니다.</p><button class="btn" onclick="go('home')">확인</button></div>`}
function schedule(){return `<div class="sectionhead">🗓️ 클럽 일정</div><div class="page"><h2>2026년 9월</h2><div class="calendar">${['일','월','화','수','목','금','토',...Array.from({length:30},(_,i)=>i+1)].map(x=>`<div class="${x===30?'today':''}">${x}</div>`).join('')}</div><div class="card"><b>9월 30일</b>　컨테이너 개소식</div><div class="card"><b>10월</b>　정발클럽 힐링여행</div><div class="card"><b>11월 7일</b>　가족사랑 대회</div></div>`}
function member(){return `<div class="sectionhead" style="background:#5b59d6">👥 회원 공간</div><div class="page"><div class="card">👤 <b>회원 명단</b><p>회원 정보는 관리자 권한 연결 후 제공됩니다.</p></div><div class="card">✏️ <b>내 정보 수정</b></div><div class="card">💳 <b>회비 납부 내역</b></div><div class="card">✉️ <b>쪽지함</b></div></div>`}
function gallery(){return `<div class="sectionhead" style="background:#079b88">🖼️ 사진첩</div><div class="page"><div class="gallery">${['🏌️','⛳','🏆','🎉','🌳','📷'].map(x=>`<div class="ph">${x}</div>`).join('')}</div></div>`}
function adminPanel(){return `<div class="sectionhead" style="background:#263442">⚙️ 관리자 화면</div><div class="page"><p>관리자 전용 화면입니다.</p><button class="btn" onclick="adminLogout()">로그아웃</button><div class="admin-grid"><div class="admin-grid"><button onclick="alert('다음 버전에서 공지 등록 기능을 연결합니다.')">📣 공지 관리</button><button onclick="go('schedule')">📅 일정 관리</button><button onclick="go('applicants')">📝 행사 신청자</button><button onclick="go('applicants')">🏆 대회 신청자</button><button>👥 회원 관리</button><button>🖼️ 사진 관리</button></div></div>`}
 function adminLogout(){sessionStorage.removeItem('jb_admin_token');location.hash='#home';render();}
 async function adminLogin(){
  const email = prompt('관리자 이메일을 입력하세요.');
  if (!email) return;

  const password = prompt('관리자 비밀번호를 입력하세요.');
  if (!password) return;

  try {
    const response = await fetch(
      SUPABASE_URL + '/auth/v1/token?grant_type=password',
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email: email, password: password })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert('이메일 또는 비밀번호를 확인해주세요.');
      return;
    }

    sessionStorage.setItem('jb_admin_token', data.access_token);
    render();
  } catch (error) {
    alert('로그인 중 오류가 발생했습니다.');
  }
}
function adminLogout(){
  sessionStorage.removeItem('jb_admin_token');
  render();
}
function admin(){
  const token = sessionStorage.getItem('jb_admin_token');

  if (token) {
    return adminPanel();
  }

  return '<div class="sectionhead" style="background:#263442">🔐 관리자 로그인</div><div class="page"><button onclick="adminLogin()">관리자 로그인</button></div>';
}
function applicants(){return `<div class="sectionhead">👥 신청자 명단</div><div class="page"><div class="card"><b>총 신청 ${applications.length}명</b></div><table><thead><tr><th>구분</th><th>이름</th><th>연락처</th><th>참석</th><th>동반</th></tr></thead><tbody>${applications.map(a=>`<tr><td>${a.kind}</td><td>${a.name}</td><td>${a.phone}</td><td>${a.attend}</td><td>${a.guests}</td></tr>`).join('')||'<tr><td colspan="5">아직 신청자가 없습니다.</td></tr>'}</tbody></table></div>`}
async function loadApplications(){
  const response = await fetch(`${SUPABASE_URL}/rest/v1/event_applications?select=*`, {
    headers: {
      'apikey': SUPABASE_KEY,
     'Authorization': `Bearer ${sessionStorage.getItem('jb_admin_token')}`
    }
  });

  if(!response.ok){
    console.error(await response.text());
    return;
  }

  applications = await response.json();
  localStorage.setItem('jb_apps', JSON.stringify(applications));
}
 function render(){let p=(location.hash||'#home').slice(1);let x=p==='home'?home():p==='notices'?noticesPage():p.startsWith('notice-')?notice(+p.split('-')[1]):p==='event'?eventForm():p==='contest'?eventForm('대회'):p==='success'?success():p==='schedule'?schedule():p==='member'?member():p==='gallery'?gallery():p==='admin'?admin():p==='applicants'?applicants():home();layout(x)}
window.addEventListener('hashchange',render);render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 
</script></body></html>
